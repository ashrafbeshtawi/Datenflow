services:
  php:
    build: docker/php
    ports:
      - "8080:80"
    volumes:
      - .:/app
    command: sh -c "composer install --no-interaction && apache2-foreground"
    environment:
      DATABASE_URL: "postgresql://app:app@database:5432/app?serverVersion=18&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # 5433 on the host: 5432 is commonly taken by other local stacks
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db-data:
