name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed project name so the compose network is deterministically kiwelt_default
  COMPOSE_PROJECT_NAME: kiwelt

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Boot the compose stack
        run: docker compose up -d --build

      - name: Wait for the site on :8080
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "site is up"
              exit 0
            fi
            sleep 2
          done
          echo "site did not become ready in time" >&2
          docker compose logs php
          exit 1

      - name: Install Chromium for E2E tests (Panther)
        run: docker compose exec -T php sh -c "apt-get update && apt-get install -y --no-install-recommends chromium chromium-driver"

      - name: Prepare test database
        run: |
          docker compose exec -T php bin/console doctrine:database:create --if-not-exists --env=test
          docker compose exec -T php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test

      - name: PHPUnit inside the container
        run: >
          docker compose exec -T
          -e PANTHER_NO_SANDBOX=1
          -e PANTHER_CHROME_ARGUMENTS=--disable-dev-shm-usage
          php vendor/bin/phpunit

      # The dev stack (target: base) never runs the prod CMD — boot the real
      # prod image against the same database so migration/permission bugs
      # (root-owned var/cache, missing env, broken CMD) fail CI, not prod.
      - name: Smoke-test the prod image
        run: |
          docker build -f docker/php/Dockerfile --target prod -t kiwelt-prod .
          docker run -d --name prod-smoke --network kiwelt_default -p 8081:80 \
            -e APP_SECRET=ci-smoke-secret \
            -e DEFAULT_URI=http://localhost:8081 \
            -e DATABASE_URL="postgresql://app:app@database:5432/app?serverVersion=18&charset=utf8" \
            -e MAILER_DSN=null://null \
            -e MAIL_FROM=ci@example.com \
            -e MAIL_TO_CONTACT=ci@example.com \
            -e MAIL_TO_KARRIERE=ci@example.com \
            kiwelt-prod
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081 > /dev/null; then
              echo "prod image serves"
              exit 0
            fi
            sleep 2
          done
          echo "prod image did not serve in time" >&2
          docker logs prod-smoke
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs
          docker logs prod-smoke 2>/dev/null || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f prod-smoke 2>/dev/null || true
          docker compose down -v

  publish:
    needs: [tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
