<VirtualHost *:80>
    DocumentRoot /app/public

    <Directory /app/public>
        AllowOverride None
        Require all granted
        # Route everything that is not an existing file to Symfony's front controller
        FallbackResource /index.php

        # /index.php[/path] would serve duplicates of / and /path: 301 to the clean URL.
        # REDIRECT_STATUS is empty only for the client's own request, not for
        # FallbackResource's internal redirect to /index.php (that would loop).
        # Apache makes redirect targets absolute with its own scheme (http behind
        # the TLS proxy), so take the scheme from X-Forwarded-Proto when it's https.
        RewriteEngine On
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP:X-Forwarded-Proto} =https
        RewriteRule ^index\.php(?:/(.*))?$ https://%{HTTP_HOST}/$1 [R=301,L]
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteRule ^index\.php(?:/(.*))?$ /$1 [R=301,L]
    </Directory>
</VirtualHost>
