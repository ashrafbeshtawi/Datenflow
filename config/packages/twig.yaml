twig:
    file_name_pattern: '*.twig'
    # All times are naive Europe/Berlin wall-clock, and PHP's default timezone is
    # pinned to Europe/Berlin too (docker/php timezone.ini) — hydration and the
    # date filter MUST agree, otherwise rendered times drift by the UTC offset.
    date:
        timezone: 'Europe/Berlin'

when@test:
    twig:
        strict_variables: true
