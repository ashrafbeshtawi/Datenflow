# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Cache busting: asset() appends ?<version> to css/js/img URLs, so browsers
    # pick up changed files instead of serving a stale cache. Bump on release.
    assets:
        version: '2026-08-30.2'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Prod runs behind a TLS-terminating reverse proxy on the Docker network.
    # Trust its X-Forwarded-* headers, or Symfony sees plain http and builds
    # http:// redirects (e.g. /services/ -> http://.../services) and URLs.
    trusted_proxies: 'private_ranges'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
